<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #2b2b2b;
      color: #ffffff;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 16px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #aaaaaa;
    }
    select, input {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      box-sizing: border-box;
      background: #3c3c3c;
      border: 1px solid #555;
      color: white;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    #startBtn {
      background-color: #4CAF50;
      color: white;
    }
    #startBtn:hover { background-color: #45a049; }
    #stopBtn {
      background-color: #f44336;
      color: white;
    }
    #stopBtn:hover { background-color: #da190b; }
  </style>
</head>
<body>
  <h3>Echo Speed</h3>
  
  <label for="frameSelect">Console Context (Frame):</label>
  <select id="frameSelect">
    <option value="0">Loading frames...</option>
  </select>

  <label for="speed">Target Speed (e.g., 2.5):</label>
  <input type="number" id="speed" value="2.5" step="0.1" min="0.1">
  
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>

  <script src="popup.js"></script>
</body>
</html>
